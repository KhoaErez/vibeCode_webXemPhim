version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://pyefmwwjtsabrcprbnrb.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-sb_publishable_T3tKOFyz13eOX7EPpHnXpw_j1SftGtt}
    image: rap-nha-web:latest
    container_name: rap_nha_web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://pyefmwwjtsabrcprbnrb.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-sb_publishable_T3tKOFyz13eOX7EPpHnXpw_j1SftGtt}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FEEDBACK_RECEIVER_EMAIL=${FEEDBACK_RECEIVER_EMAIL:-khoadev27@gmail.com}
      - FEEDBACK_SENDER_EMAIL=${FEEDBACK_SENDER_EMAIL}
    env_file:
      - .env.local
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
